services:
  postgres:
    image: postgres:16-alpine
    container_name: school-sms-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-school}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-schoolsecret}
      - POSTGRES_DB=${DB_NAME:-school_sms}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-school} -d ${DB_NAME:-school_sms}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
